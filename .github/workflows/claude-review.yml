name: Revue automatique par Claude

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the current working directory.
            Read CLAUDE.md first for this project's conventions (TDD workflow, domain/
            layering, French UI strings, test layout under tests/<kind>/).

            Review this pull request for:
            - correctness bugs
            - violations of the conventions documented in CLAUDE.md
            - reuse/simplification opportunities in the changed files only

            This review is advisory only: it never blocks or approves the merge, so
            focus on genuine, actionable findings rather than nitpicks.

            Use `gh pr diff` to see the changes and `gh pr comment` to post a single
            top-level comment summarizing your findings (or "Aucune remarque." if there
            are none). Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to a specific line.
            Only post GitHub comments - never post review text as a chat message, and
            never push commits or modify files.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
